name: Actualizar Lista IPTV

on:
  schedule:
    - cron: '5 18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <--- Este permiso es INDISPENSABLE para actualizar el repo
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias
        run: |
          pip install requests PyGithub playwright
          playwright install chromium
          
      - name: Ejecutar script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Usar el token nativo de GitHub
          REPO_NAME: ${{ github.repository }}
        run: |
          python script.py
